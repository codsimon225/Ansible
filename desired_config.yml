---
- name: Enforce desired configuration
  hosts: lab
  become: true

  tasks:
    - name: Ensure application configuration directory exists
      ansible.builtin.file:
        path: /etc/myapp
        state: directory
        owner: root
        group: root
        mode: '0755'


    - name: Enforce application configuration
      ansible.builtin.template:
        src: /home/labuser/Ansible/templates/app.config.j2
        dest: /etc/myapp/app.conf
        owner: root
        group: root
        mode: '0644'

    - name: Enforce system MOTD
      ansible.builtin.copy:
        content: "This server is managed by Ansible.\n"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'
